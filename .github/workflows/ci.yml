name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -W error::DeprecationWarning
      - run: uv run python examples/missing_export.py
      - run: uv run python examples/model-promotion/run.py --output .runs/promotion --demonstrate-failure
      - name: Publish the demonstrated decisions to the job summary
        shell: bash
        run: cat .runs/promotion/reviews/*/review.md >> "$GITHUB_STEP_SUMMARY"
      - run: uv build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/evidence-gate" init-example wheel-example
          "$RUNNER_TEMP/wheel-env/bin/evidence-gate" validate --spec wheel-example/evidence-gate.yaml --run wheel-example/runs/demo-run --json-out status.json --md-out summary.md --junit-out junit.xml
          "$RUNNER_TEMP/wheel-env/bin/evidence-gate" packet --status status.json --md-out review-packet.md
          "$RUNNER_TEMP/wheel-env/bin/evidence-gate" init-example wheel-promotion --name model-promotion
          "$RUNNER_TEMP/wheel-env/bin/python" wheel-promotion/run.py --output promotion-results --demonstrate-failure

  replay-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Verify the pinned companion tools and failure paths
        working-directory: examples/replay-pipeline
        run: |
          uv sync --locked --group dev
          uv run --locked pytest -q test_pipeline.py
          uv run --locked python run.py --output .runs/ci --demonstrate-failure
