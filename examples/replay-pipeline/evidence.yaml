schema_version: 1
reports:
  - name: replay-review
    path: reports/pipeline.json
    expected_status: passed
    required_fields: [comparison_schema, counts, metrics, outputs]
    counts:
      input_events: {min: 1}
      scenarios: {min: 3}
      gate_failures: {max: 0}
      missing_markouts: {min: 0, max: 0}
    metrics:
      minimum_markout_coverage: {min: 1, max: 1}
    outputs:
      input_contract:
        path_field: outputs.input_contract
        sha256_field: sha256.input_contract
      comparison_json:
        path_field: outputs.comparison_json
        sha256_field: sha256.comparison_json
      comparison_csv:
        path_field: outputs.comparison_csv
        sha256_field: sha256.comparison_csv
        csv_columns: [name, decision_count, filled_count, markout_count, markout_coverage, fee_total, edge_after_fees, gate_failure_count]
      comparison_review:
        path_field: outputs.comparison_review
        sha256_field: sha256.comparison_review
