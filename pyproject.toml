[project]
name = "evidence-gate"
version = "0.1.0"
description = "Validate local run artifacts against review-ready evidence contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evidence Gate contributors" }]
keywords = ["validation", "research", "evaluation", "artifacts", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://example.invalid/evidence-gate"
Documentation = "https://example.invalid/evidence-gate/docs"
Issues = "https://example.invalid/evidence-gate/issues"

[project.scripts]
evidence-gate = "evidence_gate.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
